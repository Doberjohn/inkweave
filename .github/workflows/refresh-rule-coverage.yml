name: Refresh rule coverage

# Keeps the coverage blocks in packages/synergy-engine/*_RULE.md (#479) in step with master.
# The engine-auto-rebuild hook refreshes them after engine edits made through Claude Code, but
# card data reaches master without it: admin's reveal publisher and tuning editor commit through
# the GitHub API, reveal and set-graduation PRs merge, and anyone can edit outside Claude Code.
# After such a push this reruns the refresh and commits the docs whose numbers moved, as
# github-actions[bot] with [skip ci], so it starts no CI or deploy and deploy-drift ignores it.
#
# A PR that also changed a generated block can conflict with these commits: take either side of
# the block, then run `pnpm refresh-rule-coverage` and commit what it writes.

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/public/data/allCards.json'
      - 'apps/web/public/data/previewCards.json'
      - 'packages/synergy-engine/src/**' # engine source, tuning.json included
      - 'packages/synergy-engine/*_RULE.md' # a hand edit or a merge inside a block
      - 'scripts/refresh-rule-coverage.mjs'
      - 'scripts/lib/rule-coverage/**'
      - '.github/workflows/refresh-rule-coverage.yml'
  # A manual run refreshes the branch it runs on: master, or a throwaway branch to rehearse on.
  workflow_dispatch:

# One run at a time per branch. A push that lands mid-run queues one more, which starts from the
# new tip.
concurrency:
  group: refresh-rule-coverage-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    # Skip the workflow's own commits. Belt-and-suspenders, as in convert-reveal-images.yml:
    # pushes made with GITHUB_TOKEN start no workflow, and the commit carries [skip ci].
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HUSKY: '0'
      BRANCH: ${{ github.ref_name }}
    steps:
      # The branch's tip, not the pushed commit: a queued run must start from the commit the run
      # before it pushed. The job pushes, so it keeps checkout's credentials.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A refresh that fails exits non-zero before it writes anything (#479), so the job fails
      # and the docs stay as they were.
      - name: Refresh the coverage blocks and commit what moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            pnpm build:engine
            summary=$(node scripts/refresh-rule-coverage.mjs)
            echo "$summary"
            git add packages/synergy-engine/*_RULE.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit --no-verify -m "docs(engine): refresh rule coverage [skip ci]" -m "$summary"
            if git push --no-verify origin "HEAD:$BRANCH"; then
              exit 0
            fi
            # Another push landed mid-run. Every block can be derived again, so start over from
            # the new tip instead of rebasing onto it.
            echo "Push attempt $attempt was rejected: $BRANCH moved. Regenerating on its new tip."
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
          done
          echo "::error::Could not push the refreshed rule coverage after 3 attempts."
          exit 1
