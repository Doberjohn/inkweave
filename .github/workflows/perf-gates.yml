name: Performance Gates

on:
  pull_request:
    branches: [master, main]
  # Master is measured too, so a regression that arrives by merge shows up on the merge
  # commit instead of on whichever PR runs next (#729). Only Bundle Size runs here: the
  # benchmarks compare a PR against its base, and a push has no base.
  push:
    branches: [master]

# A newer push to a PR cancels that PR's older run (#867). Each push to master gets a group
# of its own, so it is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('perf-gates-{0}', github.ref) || format('perf-gates-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default (#738). A job-level block replaces this one rather than merging with
# it, so each job that needs more restates contents: read alongside its extra scope.
permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # paths-filter lists the PR's files through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      handoff: ${{ steps.filter.outputs.handoff }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # handoff: what decides how a prerendered page hands over to the app (#915): the
          # page and its inline script, the build that transforms it, the crawl that marks it,
          # how Vercel serves it, how long the app holds it and what each route waits for, the
          # first render each page makes from that data and the capture's art, the check
          # itself, and the dependencies they all run on (a React Router, Vite or Playwright
          # bump can change the handoff with no file here).
          filters: |
            engine:
              - 'packages/synergy-engine/**'
            handoff:
              - 'apps/web/index.html'
              - 'apps/web/src/main.tsx'
              - 'apps/web/src/router.tsx'
              - 'apps/web/src/prerenderedRoutes.json'
              - 'apps/web/src/AppLayout.tsx'
              - 'apps/web/src/shared/lib/prerenderHold.ts'
              - 'apps/web/src/shared/lib/prerenderedArt.ts'
              - 'apps/web/src/shared/lib/routeReadiness.ts'
              - 'apps/web/src/shared/lib/lazyWithRetry.ts'
              - 'apps/web/src/shared/hooks/useArtLoad.ts'
              - 'apps/web/src/shared/hooks/useFilterParams.ts'
              - 'apps/web/src/shared/hooks/useScrollToTopOnRouteChange.ts'
              - 'apps/web/src/shared/components/CardImage.tsx'
              - 'apps/web/src/shared/components/PrintingCarousel.tsx'
              - 'apps/web/src/features/cards/cardListRequest.ts'
              - 'apps/web/src/features/cards/featured.ts'
              - 'apps/web/src/features/cards/components/BrowseCardGrid.tsx'
              - 'apps/web/src/features/cards/components/CardTile.tsx'
              - 'apps/web/src/features/cards/components/FeaturedCards.tsx'
              - 'apps/web/src/features/synergies/components/SynergyCard.tsx'
              - 'apps/web/src/features/synergies/hooks/playstyleFiles.ts'
              - 'apps/web/src/features/synergies/hooks/useCardData.ts'
              - 'apps/web/src/features/synergies/hooks/usePrecomputedPlaystyles.ts'
              - 'apps/web/src/features/synergies/hooks/usePrecomputedSynergies.ts'
              - 'apps/web/src/features/voting/hooks/usePairQueue.ts'
              - 'apps/web/src/features/voting/pairsIndexRequest.ts'
              - 'apps/web/src/pages/AboutPage.tsx'
              - 'apps/web/src/pages/BrowsePage.tsx'
              - 'apps/web/src/pages/CardPage.tsx'
              - 'apps/web/src/pages/HomePage.tsx'
              - 'apps/web/src/pages/PlaystyleDetailPage.tsx'
              - 'apps/web/src/pages/PlaystyleGalleryPage.tsx'
              - 'apps/web/src/pages/VotePage.tsx'
              - 'apps/web/src/pages/votePageChunk.ts'
              - 'apps/web/vite.config.ts'
              - 'scripts/prerender.mjs'
              - 'scripts/serve-dist.mjs'
              - 'scripts/check-prerender-handoff.mjs'
              - 'scripts/check-rendered-html.mjs'
              - 'scripts/lib/mime.mjs'
              - 'scripts/lib/captureMedia.mjs'
              - 'vercel.json'
              - '.github/workflows/perf-gates.yml'
              - 'package.json'
              - 'apps/web/package.json'
              - 'pnpm-lock.yaml'

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    # Writes the size-limit PR comment. Permissions cannot vary by event, so master pushes
    # get this grant too; their steps never use the token (see the master checkout below).
    permissions:
      contents: read
      pull-requests: write
    # Build the shape production ships (#729). The app branches on these at build time: without
    # the Supabase and Sentry values their lazy imports are dropped, so the budgets weighed a
    # bundle about 110 kB lighter than the one served. Without the PostHog key, the PostHog SDK
    # budget would weigh nothing at all (#827). Placeholders suffice, since only their presence
    # changes the bundle; none of them is ever contacted. Keep this list in step with every
    # VITE_* that Vercel Production sets, plus VITE_LOCAL_IMAGES from build:vercel.
    # The boolean flags are set by name from Vercel's list; their production values are not
    # read here, so they are pinned 'true', which builds the heavier shape: a flag that is off
    # in production makes the gate over-measure, never under-measure.
    env:
      VITE_SUPABASE_URL: https://ci.placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_SENTRY_DSN: https://public@ci.placeholder.ingest.sentry.io/1
      VITE_POSTHOG_KEY: phc_ci_placeholder
      VITE_LOCAL_IMAGES: 'true'
      VITE_SHOW_ACCOUNTS: 'true'
      VITE_SHOW_COLLECTION: 'true'
      VITE_SHOW_FRIENDS: 'true'
      VITE_IS_REVEAL_SEASON: 'true'
      VITE_SHOW_BETA_NOTICE: 'true'

    steps:
      # The PR path keeps the default persisted token: size-limit-action runs
      # `git fetch origin <base>` itself to build the base, which this private repo refuses
      # without it. The master path fetches nothing, so dependency scripts there get no token.
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Checkout code (master)
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Startup loads four JS files and the kit's critical CSS (#978): a module newly shared with
      # a lazy chunk that no STARTUP_SHARED line names splits into a fifth file, which the size
      # budgets barely see. This is the PR's one build: the size check measures it, then builds
      # its base into dist.
      - name: Startup shape (PR)
        if: github.event_name == 'pull_request'
        run: pnpm build && node scripts/check-bundle-shape.mjs apps/web/dist

      # Measures the PR's build above, builds its base and comments the difference. skip_step
      # applies to the PR's side only (it skips the install and the build there); the base side
      # always installs and builds.
      - name: Check bundle size
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: build
          build_script: 'build'

      # The action above throws on anything but a pull_request event, so master runs size-limit
      # directly: same build, same budgets, a plain pass or fail.
      - name: Build (master)
        if: github.event_name == 'push'
        run: pnpm build

      - name: Startup shape (master)
        if: github.event_name == 'push'
        run: node scripts/check-bundle-shape.mjs apps/web/dist

      - name: Check bundle size (master)
        if: github.event_name == 'push'
        run: pnpm size

  # prerender-handoff runs in Playwright's image for the version pnpm-lock.yaml pins, read here
  # as ci.yml's playwright-version job reads it for the e2e jobs.
  handoff-playwright-version:
    name: Playwright Version
    needs: detect-changes
    if: needs.detect-changes.outputs.handoff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # yq ships on ubuntu-latest.
      - name: Read the Playwright version from the lockfile
        id: pw
        run: |
          version="$(yq '.importers["apps/web"].devDependencies["@playwright/test"].version' pnpm-lock.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected @playwright/test version in pnpm-lock.yaml: $version"
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A prerendered page must paint only on its own route, in the layout of the screen it is on,
  # and hand over to the app without showing another page first (#915). This builds the app,
  # crawls a sample of its routes and watches them load in Chromium
  # (scripts/check-prerender-handoff.mjs). Deploy crawls every route, but on a PR only when
  # the crawl or Deploy itself changes, and never runs this check.
  prerender-handoff:
    name: Prerender Handoff
    needs: handoff-playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.handoff-playwright-version.outputs.version }}-noble
      # As in ci.yml's e2e jobs: run as uid 1001, the runner user that owns $HOME.
      options: --user 1001
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The card pages the crawl renders read the precomputed synergy files.
      - name: Build the engine and its synergy data
        run: pnpm build:engine && pnpm precompute-synergies

      - name: Build the web app
        run: pnpm build:web

      # The static pages, three playstyles and five cards, which writes dist/index.html, the
      # home page's capture that every route without a page of its own is served.
      - name: Crawl a sample of the routes
        run: node scripts/prerender.mjs
        env:
          PRERENDER_SAMPLE: '1'

      - name: Check the prerender handoff
        run: pnpm check:prerender-handoff

  engine-benchmarks:
    name: Engine Benchmarks
    needs: detect-changes
    if: needs.detect-changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    # Writes the benchmark PR comment. It goes through the Issues API, which accepts the
    # pull-requests write scope for comments on a PR.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # --- Run base branch FIRST (cold runner) so PR gets warm-runner advantage ---
      - name: Checkout PR branch (for benchmark files)
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Save bench files so they're available even if base branch lacks them
      - name: Preserve benchmark files
        run: cp -r packages/synergy-engine/src/__tests__ /tmp/bench-tests

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: false

      - name: Restore benchmark files into base
        run: cp /tmp/bench-tests/*.bench.* packages/synergy-engine/src/__tests__/ 2>/dev/null || true

      - name: Install dependencies (base)
        run: pnpm install

      - name: Build engine (base)
        run: pnpm build:engine

      # Tolerated failure: when a PR changes the benchmark harness itself (e.g. a
      # Vitest major), base's toolchain cannot run the PR's bench files. The PR
      # comment then reports no comparable base and skips the regression check.
      - name: Run benchmarks (base)
        run: |
          cd packages/synergy-engine
          npx vitest bench --run --reporter=verbose --reporter=json --outputFile.json=/tmp/bench-base.json || true

      # --- Now run PR branch (warm runner) ---
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Install dependencies (PR)
        run: pnpm install

      - name: Build engine (PR)
        run: pnpm build:engine

      - name: Run benchmarks (PR)
        run: |
          cd packages/synergy-engine
          npx vitest bench --run --reporter=verbose --reporter=json --outputFile.json=/tmp/bench-pr.json

      - name: Post benchmark results to PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // --- Load results ---
            let pr, base;
            try {
              pr = JSON.parse(fs.readFileSync('/tmp/bench-pr.json', 'utf8'));
            } catch {
              core.warning('PR benchmark results not found — skipping comment');
              return;
            }
            try {
              base = JSON.parse(fs.readFileSync('/tmp/bench-base.json', 'utf8'));
            } catch {
              core.info('Base benchmark results not found — showing PR results only');
            }

            // --- Extract benchmarks into a flat map: "group > name" → { hz, mean, rme } ---
            // Vitest 5 JSON reporter: testResults[].assertionResults[].benchmarks[].tasks[].
            // A bench group is named after its test(), so keys match the pre-v5 format.
            // hz is throughput.mean, the ops/s figure Vitest's own table prints.
            function extractBenchmarks(data) {
              const map = new Map();
              for (const file of data.testResults || []) {
                for (const test of file.assertionResults || []) {
                  for (const group of test.benchmarks || []) {
                    for (const task of group.tasks || []) {
                      map.set(`${group.name} > ${task.name}`, {
                        hz: task.throughput.mean,
                        mean: task.latency.mean,
                        rme: task.latency.rme,
                      });
                    }
                  }
                }
              }
              return map;
            }

            const prMap = extractBenchmarks(pr);
            if (prMap.size === 0) {
              core.setFailed('PR benchmark run produced no results: check the bench files and the Vitest JSON shape');
              return;
            }
            // An empty base map means the base run produced nothing comparable; treat it as absent.
            const baseRaw = base ? extractBenchmarks(base) : null;
            if (baseRaw && baseRaw.size === 0) {
              core.warning('Base benchmark run produced no comparable results; regression check skipped');
            }
            const baseMap = baseRaw && baseRaw.size > 0 ? baseRaw : null;

            // --- Build markdown table ---
            // Each new synergy rule adds an O(n) scan to findSynergies for matching cards.
            // With 4 MVP archetypes planned (Discard, Bounce, Ramp, Damage/Removal),
            // expect ~4-6x overhead vs a 1-rule baseline. Threshold accommodates rule growth.
            const FAIL_THRESHOLD = -70;
            const fmt = (n) => n >= 1000 ? n.toLocaleString('en-US', { maximumFractionDigits: 0 }) : n.toFixed(2);

            let rows = '';
            const regressions = [];
            for (const [key, prBench] of prMap) {
              const baseBench = baseMap?.get(key);
              const hzStr = fmt(prBench.hz);
              const meanStr = `${prBench.mean.toFixed(4)} ms`;
              const rmeStr = `\u00b1${prBench.rme.toFixed(2)}%`;

              let deltaStr = '—';
              if (baseBench) {
                const pct = ((prBench.hz - baseBench.hz) / baseBench.hz) * 100;
                const sign = pct >= 0 ? '+' : '';
                const icon = pct < -10 ? '\ud83d\udd34' : pct > 10 ? '\ud83d\udfe2' : '\u26aa';
                deltaStr = `${icon} ${sign}${pct.toFixed(1)}%`;

                if (pct < FAIL_THRESHOLD) {
                  regressions.push({ name: key, pct });
                }
              }

              rows += `| ${key} | ${hzStr} ops/s | ${meanStr} | ${rmeStr} | ${deltaStr} |\n`;
            }

            const statusLine = regressions.length > 0
              ? `\n\n> **\u274c Failed:** ${regressions.map(r => `\`${r.name}\` (${r.pct.toFixed(1)}%)`).join(', ')} regressed beyond the ${FAIL_THRESHOLD}% threshold.`
              : '';

            const body = [
              '### \u26a1 Engine Benchmark Results',
              '',
              '| Benchmark | Throughput | Mean | Margin | vs. Base |',
              '| --- | --: | --: | --: | :-: |',
              rows.trim(),
              '',
              baseMap
                ? '_Compared against base branch. \ud83d\udfe2 >10% faster \u00b7 \u26aa within 10% \u00b7 \ud83d\udd34 >10% slower \u00b7 Fails at >70% regression._'
                : '_No comparable base branch results (the base run failed, or this PR changes the benchmark harness itself), so the regression check was skipped._',
              statusLine,
            ].join('\n');

            // --- Post or update PR comment ---
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### \u26a1 Engine Benchmark Results';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Fail the check if any benchmark regressed beyond threshold
            if (regressions.length > 0) {
              core.setFailed(
                `Benchmark regression detected: ${regressions.map(r => `${r.name} (${r.pct.toFixed(1)}%)`).join(', ')}`
              );
            }
