name: Script tests (Windows)

# Some script tests only run on Windows: the worktree remover's junction and long-path safety
# checks (scripts/remove-worktree.test.mjs, it.runIf(WINDOWS)). CI is otherwise Linux-only, so
# they never ran on their own (tech debt sweep, 2026-10-13). The owner works on Windows, so the
# whole script suite runs here; Linux runs it in CI's build-and-test job on every PR.
on:
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - '.claude/hooks/**'
      - 'vitest.scripts.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.gitattributes'
      - '.github/workflows/script-tests-windows.yml'
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - '.claude/hooks/**'
      - 'vitest.scripts.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.gitattributes'
      - '.github/workflows/script-tests-windows.yml'
  workflow_dispatch:

# A newer push to a PR cancels that PR's older run (#867). Each push to master gets a group
# of its own, so it is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('script-tests-windows-{0}', github.ref) || format('script-tests-windows-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  script-tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # No step needs git credentials, so the install and tests (the PR's code) run with no
          # token in git's config.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # The suites import the engine's dist (getAllPlaystyles), as in build-and-test.
      - name: Build the engine
        run: pnpm build:engine

      - name: Run script tests
        run: pnpm test:scripts
