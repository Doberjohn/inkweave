name: Claude review

# Claude Code reviews a pull request when it opens ready for review, and when a draft is
# marked ready; later pushes start none. Comment "@claude review" on an open pull request
# to ask for another pass (#952). Drafts, forks and bot pull requests (Dependabot's) get
# no automatic review, and a fork's gets none on request either.
#
# The review reads the code and posts comments on the pull request, nothing else. It runs
# on the job's own token, which can't push, merge or edit a file, rather than on the
# Claude GitHub App's, which can.

on:
  pull_request:
    types: [opened, ready_for_review]
  # Only a comment from someone with write access starts the job, the branch check below
  # refuses forks, and the job's token can't write code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review:
    name: Review
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Above the Review step's own 25 minutes plus the steps around it.
    timeout-minutes: 35
    # A new request for the same pull request replaces the review still running. Any
    # other comment, a request from someone without write access included, gets a group
    # of its own run, so the job it skips can't cancel one.
    concurrency:
      group: >-
        ${{ github.event_name == 'issue_comment'
          && (!github.event.issue.pull_request
            || github.event.issue.state != 'open'
            || !startsWith(github.event.comment.body, '@claude review')
            || !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
          && format('claude-review-skip-{0}', github.run_id)
          || format('claude-review-{0}', github.event.pull_request.number || github.event.issue.number) }}
      cancel-in-progress: true
    permissions:
      contents: read # check out the pull request
      pull-requests: write # read it, and post the review's comments
      issues: read # read the pull request's conversation
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

    steps:
      # The review diffs against the pull request's base branch, read here because a
      # comment's event doesn't carry it. A comment can also ask about any pull request,
      # and a fork's branch could bring its own CLAUDE.md and .claude/ skills to steer a
      # run that holds the Claude token, so a fork's is refused. (A fork's pull request
      # never gets secrets on the pull_request event.) The start time lets the last step
      # tell this run's comments from earlier ones.
      - name: Read the pull request's base branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          info=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository,baseRefName --jq '"\(.isCrossRepository) \(.baseRefName)"')
          if [ "${info%% *}" != false ]; then
            echo "::error::Claude reviews only pull requests whose branch is in this repository."
            exit 1
          fi
          base=${info#* }
          # The name goes into Claude's instructions, so only a plain branch name passes.
          if ! [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::The base branch's name has characters this workflow doesn't pass on."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # Full history, so the review can read git log and blame for the lines it changes.
      - name: Checkout the pull request
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          persist-credentials: false

      # The review skill's subagents never see the hint in claude_args below, and diff
      # @{upstream}...HEAD, falling back to the last commit alone. A branch whose upstream
      # is the base branch makes that the pull request's whole diff.
      - name: Track the base branch
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          git checkout -q -B "review-$PR_NUMBER"
          git branch -q --set-upstream-to="origin/$BASE"

      # The scrub on the Review step runs Claude's shell commands in a bubblewrap sandbox,
      # and Claude Code won't start without one. The action installs it only when it lets
      # in users without write access, so this step does what the action's own does:
      # installs bubblewrap and socat, and lifts Ubuntu 24.04's AppArmor block on the
      # unprivileged user namespaces bubblewrap needs.
      - name: Install the sandbox for Claude's shell commands
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "apt-get attempt $attempt failed; retrying..."
            sleep 5
          done
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Claude Code's bundled /code-review skill, posting its findings as inline comments.
      # The settings turn off the repo's Claude hooks, which guard a local checkout and
      # have nothing to guard here, and .mcp.json's servers. Claude reads the code
      # with Claude Code's read-only tools and commands, and its one other tool posts an
      # inline comment on this pull request. It runs on the owner's Claude Max plan,
      # through a token from `claude setup-token`.
      - name: Review
        id: review
        # A job that hits its own timeout counts as cancelled and skips the report, so the
        # step's shorter one leaves the report time to say the review didn't finish.
        # Setup takes under a minute, well inside the job's 35.
        timeout-minutes: 25
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        env:
          # Keeps the Claude token and the job's GitHub token out of the shell commands
          # Claude runs, and runs them in the sandbox above. So gh can't reach GitHub from
          # there: Claude reads the diff with git, and the action's comment tool, outside
          # the sandbox, posts the findings.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: /code-review high --comment ${{ env.PR_NUMBER }}
          settings: '{"disableAllHooks":true,"enableAllProjectMcpServers":false,"disabledMcpjsonServers":["github"]}'
          claude_args: >-
            --model opus
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Pull request ${{ env.PR_NUMBER }} is checked out at HEAD, with full history,
            on a branch whose upstream is origin/${{ steps.pr.outputs.base }}: its diff is
            git diff @{upstream}...HEAD. The shell has no GitHub token, so gh can't reach
            GitHub. The working tree's uncommitted changes are the review action's copies of
            CLAUDE.md and .claude/ from the base branch, not the pull request's: leave them
            out of the review."

      # The skill posts nothing when it finds nothing, so this step says so on the pull
      # request, quoting the review's closing summary, which also shows why a review that
      # failed to post its findings posted none. A review that didn't finish gets a comment
      # saying so, with the reason when there is one, and turns the run red. What the run
      # would cost at API prices goes on its summary page.
      - name: Report the review
        if: ${{ !cancelled() && steps.review.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          STARTED: ${{ steps.pr.outputs.started }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          last_result() {
            jq -r --arg key "$1" '[if type == "array" then .[] else . end | select(.type? == "result")] | last | .[$key] // empty' "$EXECUTION_FILE" 2>/dev/null || true
          }
          cost=$(last_result total_cost_usd)
          if [ -n "$cost" ]; then
            echo "Review cost at API prices: US\$$cost" >> "$GITHUB_STEP_SUMMARY"
          fi
          summary=$(last_result result)
          # The action counts a review that never got going as a success: Claude Code reports
          # an API call the API refused as a result that cost nothing. (Its turn count tells
          # nothing: a finished review reports none either.) A review cut off later, such as
          # by the plan's usage limit, ends as a success too, its result starting with why.
          stopped="^(API Error|You've hit your|You've reached your|You're out of|Claude AI usage limit|Credit balance is too low|Prompt is too long)"
          if [ "$REVIEW_OUTCOME" = success ] && awk -v cost="${cost:-0}" 'BEGIN { exit !(cost + 0 > 0) }' \
            && [ "$(last_result is_error)" != true ] && ! [[ "$summary" =~ $stopped ]]; then
            # gh prints a count per page. The call has its own line so that a failed call fails
            # the step, where a pipe into awk would count it as no comments.
            counts=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and .created_at >= env.STARTED)] | length')
            posted=$(awk '{ n += $1 } END { print n + 0 }' <<< "$counts")
            if [ "$posted" -gt 0 ]; then
              exit 0
            fi
            body="Claude Code reviewed $(git rev-parse --short HEAD) and posted no inline comments."
            finished=true
          else
            body="Claude Code's review of $(git rev-parse --short HEAD) didn't finish."
            finished=false
          fi
          if [ -n "$summary" ]; then
            # A zero-width space after each @ keeps the quoted summary from mentioning anyone,
            # and GitHub takes a comment of up to 65,536 characters, so the quote is cut after
            # both have lengthened it.
            summary=${summary//@/@$'\xe2\x80\x8b'}
            quote="> ${summary//$'\n'/$'\n'> }"
            if [ "${#quote}" -gt 60000 ]; then
              quote="${quote:0:60000} (cut short)"
            fi
            body+=$'\n\n'"$quote"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          if [ "$finished" = false ]; then
            echo "::error::The review didn't finish: the comment on the pull request says why."
            exit 1
          fi
