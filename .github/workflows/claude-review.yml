name: Claude review

# Claude Code reviews each pull request once: when it opens ready for review, or when a
# draft is marked ready. Comment "@claude review" on a pull request to ask for another
# pass (#952). Drafts, forks and bot pull requests (Dependabot's) get no review.
#
# The review reads the code and posts comments on the pull request, nothing else. It runs
# on the job's own token, which can't push, merge or edit a file, rather than on the
# Claude GitHub App's, which can.

on:
  pull_request:
    types: [opened, ready_for_review]
  # Only a comment from someone with write access starts the job, the branch check below
  # refuses forks, and the job's token can't write code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review:
    name: Review
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.type != 'Bot')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new request for the same pull request replaces the review still running. The group
    # sits on the job, not the workflow, so the many comments that skip the job never
    # cancel a review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read # check out the pull request
      pull-requests: write # read it, and post the review's comments
      issues: read # read the pull request's conversation
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

    steps:
      # A comment can ask about any pull request, and a fork's branch could bring its own
      # CLAUDE.md and .claude/ skills to steer a run that holds the API key. Fork pull
      # requests never get secrets on the pull_request event, so only the comment path
      # needs this check.
      - name: Check the branch is in this repository
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cross=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != false ]; then
            echo "::error::Claude reviews only pull requests whose branch is in this repository."
            exit 1
          fi

      # Full history, so the review can read git log and blame for the lines it changes.
      - name: Checkout the pull request
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          persist-credentials: false

      # Claude Code's bundled /code-review skill, posting its findings as inline comments.
      # The settings turn off the repo's Claude hooks, which guard a local checkout and
      # have nothing to guard here, and .mcp.json's GitHub server.
      - name: Review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          # Strips the API key from the shell commands Claude runs, which need only the
          # job's token.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: /code-review high --comment ${{ env.PR_NUMBER }}
          settings: '{"disableAllHooks":true,"disabledMcpjsonServers":["github"]}'
          claude_args: >-
            --model opus
            --disallowedTools "Edit,Write,NotebookEdit"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *),Bash(gh api *),Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git blame *)"
