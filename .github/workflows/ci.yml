name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # TEMPORARY (non-blocking): npm retired the legacy audit endpoint (HTTP 410) on
      # 2026-07-15, and every current pnpm version still queries it (verified in CI:
      # even pnpm 11 hits the retired endpoint, not the bulk advisory one), so
      # `pnpm audit` fails with no working version to bump to. Kept running so the step
      # self-heals (goes green) once pnpm ships the bulk-endpoint fix, at which point
      # remove continue-on-error. Proper migration to osv-scanner tracked separately.
      # See pnpm/pnpm#11265.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level high --prod

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type-check
        run: pnpm --filter inkweave-web typecheck

      - name: Build packages
        run: pnpm build

      - name: Run linting
        run: pnpm lint

      # Backstops for the local pre-push gates (#508): story coverage was
      # previously local-only; the design-token value gate ships with it.
      - name: Story coverage gate
        run: pnpm --filter inkweave-web check:stories

      - name: Design-token value gate
        run: pnpm --filter inkweave-web check:design

      - name: Run engine tests
        run: pnpm --filter inkweave-synergy-engine test:run

      - name: Run web tests with coverage
        run: pnpm --filter inkweave-web test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

      - name: Upload build artifacts for E2E
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/synergy-engine/dist/
            apps/web/dist/
          retention-days: 1

  e2e-tests:
    # Split by Playwright project so all 5 browsers run in parallel jobs instead of serially in
    # a single job. Previous serial layout sat at an 18m baseline against a 30m wall — variance
    # alone was timing out runs. Parallel matrix gives each browser its own runner + timeout.
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    strategy:
      # Don't cancel sibling browsers when one fails — we want the full per-browser report.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    name: e2e-tests (${{ matrix.project }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Pre-compute synergy data
        run: pnpm precompute-synergies

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm --filter inkweave-web exec playwright --version)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-${{ runner.os }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter inkweave-web exec playwright install --with-deps

      - name: Install Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter inkweave-web exec playwright install-deps

      - name: Run E2E tests
        run: pnpm --filter inkweave-web test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          # Per-project artifact names so the 5 parallel jobs don't collide on upload.
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 7
