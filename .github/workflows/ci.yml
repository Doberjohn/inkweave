name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A newer push to a PR cancels that PR's older run, whose results nobody needs once it is
# superseded (#867). Each push to master gets a group of its own, so a merge's run is never
# cancelled or queued behind another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    # Every job here runs on the owner's PC while the repository variable CI_ON_PC is 'true',
    # except a pull request from another repository's branch. That keeps an ordinary fork's PR
    # off the PC, but a fork's PR runs its own copy of this file, so the repo being private is
    # what keeps strangers' code off it (docs/SELF_HOSTED_RUNNER.md).
    runs-on: ${{ vars.CI_ON_PC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'inkweave-linux' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # pnpm 11 queries npm's bulk advisory endpoint. The pinned pnpm 10 still queries the
      # legacy one, which npm is retiring (it answered HTTP 410 on 2026-07-15, #490).
      # --pm-on-fail=ignore stops pnpm 11 from handing the command to the packageManager
      # pin, which is how it looked broken in July. Audits dev and prod dependencies and
      # fails on high or critical. To waive an accepted advisory, add its GHSA id under
      # audit.ignore in pnpm-workspace.yaml, with the reason in a comment.
      - name: Audit dependencies
        run: pnpm dlx pnpm@11.28.2 audit --pm-on-fail=ignore --audit-level high

  build-and-test:
    runs-on: ${{ vars.CI_ON_PC == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'inkweave-linux' || 'ubuntu-latest' }}
    # Coverage is collected and uploaded on master pushes only (#964). The second value says
    # whether the token is set, so no step needs the token itself to decide.
    env:
      COLLECT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      CODESCENE_TOKEN_SET: ${{ secrets.CODESCENE_COVERAGE_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type-check
        run: pnpm --filter inkweave-web typecheck

      - name: Type-check the UI package
        run: pnpm --filter inkweave-ui typecheck

      - name: Build packages
        run: pnpm build

      # Root-level script suites (#524). These were runnable but wired into no hook
      # and no workflow, so the only automated assertions that the sitemap stays on
      # the apex host and omits priority/changefreq never ran. Must come after
      # "Build packages" — the suites import getAllPlaystyles from the engine dist.
      # Cheap (~1.3s), so it sits early and fails fast.
      - name: Run script tests (sitemap, IndexNow, analytics)
        run: pnpm test:scripts

      - name: Run linting
        run: pnpm lint

      # Unused files, dependencies and binaries (knip.jsonc says what it ignores and why).
      - name: Dead code check
        run: pnpm knip

      # Backstops for the local pre-push gates (#508): story coverage was
      # previously local-only; the design-token value gate ships with it.
      - name: Story coverage gate
        run: pnpm --filter inkweave-web check:stories

      - name: Design-token value gate
        run: pnpm --filter inkweave-web check:design

      # A push to master collects coverage for CodeScene's coverage views (#964). A PR collects
      # none (#867): nothing reads it there, and it adds about 25 s.
      - name: Run engine tests
        run: pnpm --filter inkweave-synergy-engine test:run ${{ env.COLLECT_COVERAGE == 'true' && '--coverage' || '' }}

      # Admin's tuning editor commits tuning.json straight to master, so engine tests read tuned
      # values from TUNING, never as literals. This run changes every value the editor can, and
      # fails a test that pins one or reads the wrong key (src/__tests__/perturbTuning.ts, #1015).
      - name: Run engine tests with every tuned value edited
        run: pnpm --filter inkweave-synergy-engine test:perturbed

      - name: Run web tests
        run: pnpm --filter inkweave-web test:run ${{ env.COLLECT_COVERAGE == 'true' && '--coverage' || '' }}

      - name: Run UI package tests
        run: pnpm --filter inkweave-ui test:run ${{ env.COLLECT_COVERAGE == 'true' && '--coverage' || '' }}

      # CodeScene's coverage views (#964): line and branch coverage for the engine, the web app
      # and inkweave-ui, uploaded for this commit; CodeScene's analysis reads the newest upload at
      # or before the commit it analyses. A CodeScene outage must not turn master red, so both
      # steps only warn, and neither runs until the owner sets the CODESCENE_COVERAGE_TOKEN secret.
      # The installer runs in a step of its own, so the script it fetches never sees the token.
      - name: Install CodeScene's coverage tool
        if: env.COLLECT_COVERAGE == 'true'
        continue-on-error: true
        shell: bash
        env:
          CS_COVERAGE_VERSION: 1.0.40
        run: |
          if [ "$CODESCENE_TOKEN_SET" != true ]; then
            echo "::notice::CODESCENE_COVERAGE_TOKEN is not set; skipping the coverage upload."
            exit 0
          fi
          curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh | sh -s -- -y "$CS_COVERAGE_VERSION"

      # One report for all three, uploaded from the repo root, as cs-coverage requires.
      - name: Upload coverage to CodeScene
        if: env.COLLECT_COVERAGE == 'true' && env.CODESCENE_TOKEN_SET == 'true'
        continue-on-error: true
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CODESCENE_COVERAGE_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v cs-coverage > /dev/null; then
            echo "::warning::cs-coverage did not install; see the step above. Nothing was uploaded."
            exit 0
          fi
          cat packages/synergy-engine/coverage/lcov.info apps/web/coverage/lcov.info \
            packages/ui/coverage/lcov.info > coverage.lcov
          for metric in line-coverage branch-coverage; do
            cs-coverage upload --format lcov --metric "$metric" coverage.lcov \
              || echo "::warning::CodeScene coverage upload failed ($metric)"
          done

  # E2E on every push: chromium and mobile-chrome, which share a job (#867), on the dev server,
  # where React logs its development-only errors, which the console guard fails on, and a PR
  # pushed without the pre-push hook gets that check here. Master's pushes run it too: admin's
  # tools commit card data and tuning straight to master, and a merge can land on a master that
  # moved since the PR's last run. Firefox, webkit and mobile-safari run once per pull request,
  # when it opens ready for review, and nightly on master (full-e2e.yml), so the PC that runs CI
  # carries about half the load (#1086).
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      matrix: '[{"projects": ["chromium", "mobile-chrome"], "server": "dev"}]'
