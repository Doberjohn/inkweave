name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # TEMPORARY (non-blocking): npm retired the legacy audit endpoint (HTTP 410) on
      # 2026-07-15, and every current pnpm version still queries it (verified in CI:
      # even pnpm 11 hits the retired endpoint, not the bulk advisory one), so
      # `pnpm audit` fails with no working version to bump to. Kept running so the step
      # self-heals (goes green) once pnpm ships the bulk-endpoint fix, at which point
      # remove continue-on-error. Proper migration to osv-scanner tracked separately.
      # See pnpm/pnpm#11265.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level high --prod

  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      # Read by e2e-tests to pick its Playwright image tag.
      playwright-version: ${{ steps.pw-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # e2e-tests runs in Playwright's image for this exact version, because an image's browsers
      # only work with the matching Playwright. Reading it from what the lockfile installed means
      # a Playwright bump moves the image tag in the same commit (#690). Anything but X.Y.Z fails
      # here, not as an unpullable image in five e2e jobs.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          version="$(pnpm --filter inkweave-web exec playwright --version)"
          version="${version#Version }"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected 'playwright --version' output: $version"
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Type-check
        run: pnpm --filter inkweave-web typecheck

      - name: Build packages
        run: pnpm build

      # Root-level script suites (#524). These were runnable but wired into no hook
      # and no workflow, so the only automated assertions that the sitemap stays on
      # the apex host and omits priority/changefreq never ran. Must come after
      # "Build packages" — the suites import getAllPlaystyles from the engine dist.
      # Cheap (~1.3s), so it sits early and fails fast.
      - name: Run script tests (sitemap, IndexNow, analytics)
        run: pnpm test:scripts

      - name: Run linting
        run: pnpm lint

      # Backstops for the local pre-push gates (#508): story coverage was
      # previously local-only; the design-token value gate ships with it.
      - name: Story coverage gate
        run: pnpm --filter inkweave-web check:stories

      - name: Design-token value gate
        run: pnpm --filter inkweave-web check:design

      - name: Run engine tests
        run: pnpm --filter inkweave-synergy-engine test:run

      - name: Run web tests with coverage
        run: pnpm --filter inkweave-web test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        # Diagnostic artifact only — an infra hiccup uploading it (e.g. Actions
        # storage quota exhausted) must not fail a job whose tests already passed.
        continue-on-error: true
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

      - name: Upload build artifacts for E2E
        uses: actions/upload-artifact@v7
        # A real build failure is already caught by "Build packages" above, so a
        # failure uploading here is infra (e.g. storage quota), not a bad build —
        # don't fail build-and-test for it. If the artifact is genuinely missing,
        # the e2e job's "Download build artifacts" step surfaces it downstream.
        continue-on-error: true
        with:
          name: build-output
          path: |
            packages/synergy-engine/dist/
            apps/web/dist/
          retention-days: 1

  e2e-tests:
    # Split by Playwright project so all 5 browsers run in parallel jobs instead of serially in
    # a single job. Previous serial layout sat at an 18m baseline against a 30m wall — variance
    # alone was timing out runs. Parallel matrix gives each browser its own runner + timeout.
    runs-on: ubuntu-latest
    needs: build-and-test
    # Playwright's image ships the browsers and their system packages, so this job installs
    # nothing from apt and downloads no browsers. It used to apt-install about 100 of those
    # packages per job, and on 2026-10-01 a stalling Ubuntu mirror stretched that step from
    # under a minute to 19.5 min, cancelling jobs at the timeout (#690). The tag must equal the
    # installed Playwright version, which build-and-test supplies.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build-and-test.outputs.playwright-version }}-noble
      # As in Playwright's CI docs: run as uid 1001, the runner user that owns $HOME
      # (/github/home). Run as root, Firefox refuses to start in a home it doesn't own.
      options: --user 1001
    timeout-minutes: 20
    strategy:
      # Don't cancel sibling browsers when one fails — we want the full per-browser report.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    name: e2e-tests (${{ matrix.project }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        id: download-build
        uses: actions/download-artifact@v8
        # build-and-test's build-output upload is non-fatal (storage-quota
        # resilience), so during an outage the artifact may be missing. Don't
        # fail here — the fallback step below rebuilds locally instead.
        continue-on-error: true
        with:
          name: build-output
          path: .

      - name: Rebuild if build artifact was unavailable
        # Only runs when the download above failed (e.g. the artifact was never
        # uploaded during a storage-quota outage). Produces the same dist/ the
        # artifact would have, so e2e stays green instead of dying at download.
        if: steps.download-build.outcome == 'failure'
        run: pnpm build

      - name: Pre-compute synergy data
        run: pnpm precompute-synergies

      - name: Run E2E tests
        run: pnpm --filter inkweave-web test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        # Diagnostic artifact only — a storage-quota/upload hiccup must not fail
        # the e2e job when the tests themselves determined the outcome.
        continue-on-error: true
        with:
          # Per-project artifact names so the 5 parallel jobs don't collide on upload.
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        # Diagnostic artifact only — never fail the job on the upload itself.
        continue-on-error: true
        with:
          name: test-results-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 7
