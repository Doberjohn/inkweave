name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A newer push to a PR cancels that PR's older run, whose results nobody needs once it is
# superseded (#867). Each push to master gets a group of its own, so a merge's run is never
# cancelled or queued behind another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # pnpm 11 queries npm's bulk advisory endpoint. The pinned pnpm 10 still queries the
      # legacy one, which npm is retiring (it answered HTTP 410 on 2026-07-15, #490).
      # --pm-on-fail=ignore stops pnpm 11 from handing the command to the packageManager
      # pin, which is how it looked broken in July. Audits dev and prod dependencies and
      # fails on high or critical. To waive an accepted advisory, add its GHSA id under
      # audit.ignore in pnpm-workspace.yaml, with the reason in a comment.
      - name: Audit dependencies
        run: pnpm dlx pnpm@11.28.2 audit --pm-on-fail=ignore --audit-level high

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type-check
        run: pnpm --filter inkweave-web typecheck

      - name: Build packages
        run: pnpm build

      # Root-level script suites (#524). These were runnable but wired into no hook
      # and no workflow, so the only automated assertions that the sitemap stays on
      # the apex host and omits priority/changefreq never ran. Must come after
      # "Build packages" — the suites import getAllPlaystyles from the engine dist.
      # Cheap (~1.3s), so it sits early and fails fast.
      - name: Run script tests (sitemap, IndexNow, analytics)
        run: pnpm test:scripts

      - name: Run linting
        run: pnpm lint

      # Unused files, dependencies and binaries (knip.jsonc says what it ignores and why).
      - name: Dead code check
        run: pnpm knip

      # Backstops for the local pre-push gates (#508): story coverage was
      # previously local-only; the design-token value gate ships with it.
      - name: Story coverage gate
        run: pnpm --filter inkweave-web check:stories

      - name: Design-token value gate
        run: pnpm --filter inkweave-web check:design

      - name: Run engine tests
        run: pnpm --filter inkweave-synergy-engine test:run

      # Without coverage (#867): nothing read the report, and collecting it added about 25 s.
      # `pnpm --filter inkweave-web test:coverage` still produces it locally.
      - name: Run web tests
        run: pnpm --filter inkweave-web test:run

  # e2e-tests runs in Playwright's image for this exact version, because an image's browsers
  # only work with the matching Playwright. Reading it from the lockfile means a Playwright bump
  # moves the image tag in the same commit (#690), and this sparse checkout takes seconds, so
  # the E2E jobs start with the run instead of after build-and-test (#854). Anything but X.Y.Z
  # fails here, not as an unpullable image in every e2e job. deploy.yml and deploy-staging.yml
  # run the same job.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # yq ships on ubuntu-latest.
      - name: Read the Playwright version from the lockfile
        id: pw
        run: |
          version="$(yq '.importers["apps/web"].devDependencies["@playwright/test"].version' pnpm-lock.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected @playwright/test version in pnpm-lock.yaml: $version"
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e-tests:
    # Split by Playwright project so the browsers run in parallel jobs instead of serially in
    # a single job. Previous serial layout sat at an 18m baseline against a 30m wall — variance
    # alone was timing out runs. Parallel matrix gives each browser its own runner + timeout,
    # except chromium and mobile-chrome, which share one (see the matrix).
    runs-on: ubuntu-latest
    needs: playwright-version
    # Playwright's image ships the browsers and their system packages, so this job installs
    # nothing from apt and downloads no browsers. It used to apt-install about 100 of those
    # packages per job, and on 2026-10-01 a stalling Ubuntu mirror stretched that step from
    # under a minute to 19.5 min, cancelling jobs at the timeout (#690). The tag must equal the
    # installed Playwright version, which the playwright-version job reads from the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # As in Playwright's CI docs: run as uid 1001, the runner user that owns $HOME
      # (/github/home). Run as root, Firefox refuses to start in a home it doesn't own.
      options: --user 1001
    timeout-minutes: 20
    strategy:
      # Don't cancel sibling browsers when one fails — we want the full per-browser report.
      fail-fast: false
      matrix:
        # The Playwright projects each job runs. chromium and mobile-chrome both run Chromium, so
        # they share a job (#867): that saves a job's setup and a dev server warm-up, and on two
        # workers the pair still finishes before WebKit.
        projects: [[chromium, mobile-chrome], [firefox], [webkit], [mobile-safari]]
    name: e2e-tests (${{ join(matrix.projects, ', ') }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # precompute-synergies and the dev server both import the engine's dist. The suite runs
      # against the dev server, so it needs no web build.
      - name: Build the engine
        run: pnpm build:engine

      - name: Pre-compute synergy data
        run: pnpm precompute-synergies

      - name: Run E2E tests
        run: pnpm --filter inkweave-web test:e2e --project=${{ join(matrix.projects, ' --project=') }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        # Diagnostic artifact only — a storage-quota/upload hiccup must not fail
        # the e2e job when the tests themselves determined the outcome.
        continue-on-error: true
        with:
          # Per-job artifact names so the parallel jobs don't collide on upload.
          name: playwright-report-${{ join(matrix.projects, '-') }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        # Diagnostic artifact only — never fail the job on the upload itself.
        continue-on-error: true
        with:
          name: test-results-${{ join(matrix.projects, '-') }}
          path: apps/web/test-results/
          retention-days: 7
