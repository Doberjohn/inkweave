# Prerender-aware deploy (issue #492).
#
# WHY: scripts/prerender.mjs (the SSG crawl from #486) can't run in Vercel's own build —
# Playwright's chromium has no system deps on Amazon Linux, so build:vercel falls back to
# SPA-only and non-JS crawlers get empty shells. This workflow runs the SAME build (via
# `vercel build`, which honours vercel.json's buildCommand → build:vercel) on Ubuntu, where
# `playwright install --with-deps chromium` works, so the crawl actually renders. It then
# ships the prebuilt output with `vercel deploy --prebuilt`.
#
# SAFE-TO-MERGE GATE: the job only runs when the repo variable DEPLOY_VIA_CI == 'true'.
# Until you set it (Repo → Settings → Variables → Actions), every run is skipped (grey, not
# red) and Vercel's own git integration keeps deploying as today. See #492 for the ordered
# cutover — set the three secrets + DEPLOY_VIA_CI=true, verify a preview here, and ONLY then
# disable Vercel's git auto-deploy (vercel.json `git.deploymentEnabled`) to avoid double deploys.

name: Deploy

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Inert until you flip the repo variable on (post-secrets). Fork PRs (no secrets) also skip.
    if: vars.DEPLOY_VIA_CI == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      IS_PROD: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium (with system deps — this is what Vercel's AL build can't do)
        run: pnpm --filter inkweave-web exec playwright install --with-deps chromium

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=${{ env.IS_PROD == 'true' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (runs build:vercel → the prerender crawl renders on Ubuntu)
        run: npx vercel build ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
