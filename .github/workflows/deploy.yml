# Production deploy with the prerender crawl (issue #492).
#
# WHY: scripts/prerender.mjs (the SSG crawl from #486) can't run in Vercel's own build —
# Playwright's chromium has no system deps on Amazon Linux, so build:vercel falls back to
# SPA-only and non-JS crawlers get empty shells. This workflow runs the SAME build (via
# `vercel build`, which honours vercel.json's buildCommand → build:vercel) in Playwright's
# Ubuntu image, which ships chromium and its system deps, so the crawl renders (verified:
# 1052/1052, 0 failed). It then ships the prebuilt output with `vercel deploy --prebuilt --prod`,
# retried once if it fails (scripts/vercel-deploy.mjs, #698).
#
# SCOPE: production only. PR previews stay on Vercel's own git integration (fast SPA — previews
# aren't indexed, so they don't need the crawl). vercel.json sets git.deploymentEnabled.master
# = false so Vercel does NOT also deploy master (no double / flip-flopping production deploy).
# One exception: a PR that changes this file or scripts/vercel-deploy.mjs gets a dry run
# (#694, #698). It runs the same pull, build and prerender check, then uploads the build as a
# staged production deployment that never receives inkweave.ink and is removed in the same run.
# It never pings IndexNow.
#
# KILL SWITCH: the job only runs when repo variable DEPLOY_VIA_CI == 'true'. Unsetting it stops
# CI deploys — but note Vercel git-deploy for master is off, so to fully hand deploys back to
# Vercel you must also revert the vercel.json git.deploymentEnabled change.

# deploy-drift.yml's workflow_run trigger matches this name: rename both together (#569).
name: Deploy

on:
  push:
    branches: [master]
  # A dry run for PRs that change this file or the script that runs `vercel deploy` (#698):
  # build, verify and stage-deploy, never promote.
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/vercel-deploy.mjs'

# Only actions/checkout uses GITHUB_TOKEN here: Vercel authenticates with VERCEL_TOKEN, and
# actions/cache with the runner's own token. Declared, so PR dry runs (#694) stay read-only
# whatever the repo's default token permissions become.
permissions:
  contents: read

concurrency:
  # Production deploys queue one at a time and never cancel. A PR's dry run gets its own
  # group, so it never waits behind or blocks production, and a newer push replaces it.
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Vercel CLI version for the pull, build and deploy steps. Pinned because unpinned
# `npx vercel` re-resolved @latest in each step, so one job could straddle two CLI
# versions: on 2026-09-24 pull and build ran 59.26.0, then deploy fetched the
# just-published 60.0.0, whose @vercel/ruby@12.0.0 dependency was not on npm yet
# (notarget), failing that deploy. 60.0.0 has deployed cleanly since.
# To upgrade, bump it in a PR. That PR changes this file, so its dry run exercises the new
# version's `vercel pull`, `vercel build` and `vercel deploy` (#694, #698); only promotion
# waits for the deploy after merge. Steps expand it as ${VERCEL_CLI_VERSION:?}, and
# scripts/vercel-deploy.mjs refuses to start without it, so a missing value fails the step
# instead of quietly falling back to @latest.
env:
  VERCEL_CLI_VERSION: '60.0.0'

jobs:
  # deploy runs in Playwright's image for this exact version, because an image's browsers
  # only work with the matching Playwright. container.image is resolved before any step runs,
  # so the version has to come from an earlier job. It reads what pnpm-lock.yaml pins, which
  # the deploy job's frozen install then installs, so a Playwright bump moves the image tag in
  # the same commit. Anything but X.Y.Z fails here, not as an unpullable image.
  # PRs from forks and from Dependabot get no Actions secrets, so both jobs skip on them
  # instead of failing at `vercel pull`.
  playwright-version:
    if: >-
      vars.DEPLOY_VIA_CI == 'true' && (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      # yq ships on ubuntu-latest.
      - name: Read the Playwright version from the lockfile
        id: pw
        run: |
          version="$(yq '.importers["apps/web"].devDependencies["@playwright/test"].version' pnpm-lock.yaml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected @playwright/test version in pnpm-lock.yaml: $version"
            exit 1
          fi
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deploy:
    needs: playwright-version
    if: >-
      vars.DEPLOY_VIA_CI == 'true' && (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    # A normal deploy takes 6 to 16 min. A cold card-image cache adds about 15 min (#579).
    # Without a cap a hung step could run to GitHub's 360-min default while every later
    # master push queued behind it in deploy-production (#694).
    timeout-minutes: 45
    # Playwright's image ships chromium and its system packages, so nothing comes from apt.
    # The apt step used to take 18 to 57 s, until a stalling Ubuntu mirror stretched it to
    # 534 s on 2026-10-01 (#690, #694). build:vercel's own `playwright install chromium`
    # finds the image's browser instead of downloading one.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # As in ci.yml's e2e jobs and Playwright's CI docs: run as uid 1001, the runner user
      # that owns $HOME (/github/home).
      options: --user 1001
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # download-card-images.mjs skips any card already converted in
      # node_modules/.cache/card-images. Vercel's build servers kept node_modules
      # between builds; a fresh Actions runner does not, so without this step every
      # deploy re-downloads and re-encodes all ~1,024 images (~15 min, #579). The key
      # follows the card data, so a deploy with new cards saves a fresh cache;
      # restore-keys falls back to the newest earlier one. A cache written by an older
      # CACHE_VERSION is wiped by the script itself (its .version file). The image has no
      # zstd, so this cache is gzip, a separate entry from the host-era zstd ones (#694).
      - name: Restore card image cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/card-images
          key: card-images-${{ runner.os }}-${{ hashFiles('apps/web/public/data/allCards.json', 'apps/web/public/data/previewCards.json') }}
          restore-keys: |
            card-images-${{ runner.os }}-

      - name: Pull Vercel production environment
        run: npx "vercel@${VERCEL_CLI_VERSION:?}" pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (runs build:vercel → the prerender crawl renders on Ubuntu)
        # Sentry's environment comes from VERCEL_ENV (vite.config.ts, #740). Set here, so this
        # build never depends on whether `vercel build` exposes it outside Vercel's builders.
        env:
          VERCEL_ENV: production
        run: npx "vercel@${VERCEL_CLI_VERSION:?}" build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Fatal here and ONLY here (#524). build:vercel deliberately swallows a failed
      # crawl with `|| echo` so Vercel-native preview builds — which cannot
      # `playwright install --with-deps` — degrade to SPA-only instead of failing.
      # The cost of that tolerance is that a production crawl failure also deploys
      # green, serving `<div id="root">` to every non-JS crawler. This step closes
      # that hole at the deploy boundary without touching preview behaviour.
      # `.vercel/output/static` is the Build Output API v3 static root.
      - name: Verify the prerender actually produced content
        run: node scripts/check-rendered-html.mjs .vercel/output/static

      # One upload error fails a Vercel deploy outright (@vercel/client retries only a fixed
      # list of error messages, #698); the script retries once.
      # A PR's dry run never runs this step: only a push to master deploys to production and
      # pings IndexNow.
      - name: Deploy prebuilt output to production
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel-deploy.mjs production

      # A PR's dry run uploads the same build as a staged production deployment, so the upload
      # path is tested before merge (#698). --skip-domain never promotes it to inkweave.ink, and
      # the script removes it again. It stays behind, never promoted, when a newer push cancels
      # the run between the upload and the remove, when a deploy attempt fails after Vercel
      # created it, or when the remove fails or is refused. All but the cancel turn this step
      # red. Delete a leftover in the Vercel dashboard when convenient.
      # --skip-domain covers custom domains only. Vercel still moves the project's generated
      # production URL (inkweave-johnfanidis-projects.vercel.app, behind Deployment Protection)
      # to the staged deployment, so after the remove it answers 404 until the next production
      # deploy takes it back. inkweave.ink and www.inkweave.ink stay untouched (#708's dry run).
      - name: Upload as a staged production deployment, then delete it (dry run only)
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel-deploy.mjs staged

      # Push the hub URLs to IndexNow (Bing/DuckDuckGo) for near-instant re-crawl (#496).
      # Non-fatal: a ping failure must never fail the production deploy.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        run: node scripts/ping-indexnow.mjs || true
