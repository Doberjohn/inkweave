<!doctype html>
<html lang="en">
  <head>
    <script type="module">
      // Dev-only inspector. E2E pins VITE_DISABLE_REACT_GRAB=true (playwright.config.ts):
      // there it only adds internet requests, a refused ws://localhost:4722 client and injected UI.
      if (import.meta.env.DEV && import.meta.env.VITE_DISABLE_REACT_GRAB !== 'true') {
        import("react-grab");
        import("@react-grab/claude-code/client");
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkweave — Master Lorcana Synergies</title>
    <!-- Per-route <title> + description are set by the <Seo> component (React 19 native
         metadata). The <title> above is a fallback for routes without <Seo> yet (#486). -->
    <meta name="theme-color" content="#0d0d14" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inkweave" />

    <!-- Canonical is set per-route by the <Seo> component (React 19 native metadata); no
         static canonical here so each route self-references its own URL, not the homepage (#486). -->

    <!-- Open Graph: og:title/description/url are set per-route by <Seo>; the image + type
         below are shared defaults (per-card OG images are a later phase). -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://inkweave.ink/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card: title/description set per-route by <Seo>; card type + image are defaults. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://inkweave.ink/og-image.png" />

    <!-- Fonts (self-hosted; @font-face declared in index.css). Preload the body weight
         so first paint doesn't wait on the CSS to parse. The hero serif isn't preloaded:
         neither the homepage nor a card page renders its 400 weight, so the preload only
         competed with the entry chunk for bandwidth (#640). -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin />

    <!-- Prefetch card data (loaded on app mount) -->
    <link rel="prefetch" href="/data/allCards.json" as="fetch" crossorigin />

    <!-- Structured Data: site-entity @graph (Organization + WebSite + WebApplication). #496 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://inkweave.ink/#org",
            "name": "Inkweave",
            "url": "https://inkweave.ink",
            "logo": "https://inkweave.ink/pwa-512x512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://inkweave.ink/#website",
            "name": "Inkweave",
            "url": "https://inkweave.ink",
            "publisher": { "@id": "https://inkweave.ink/#org" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://inkweave.ink/browse?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://inkweave.ink/#app",
            "name": "Inkweave",
            "url": "https://inkweave.ink",
            "description": "Discover powerful card synergies for Disney Lorcana. Inkweave analyzes every card interaction to help you build stronger decks in Core format.",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web",
            "publisher": { "@id": "https://inkweave.ink/#org" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
