packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 10 runs no dependency install scripts unless they are allowed here. With
# strictDepBuilds, an install that meets an unlisted one fails, so each new one gets a
# decision: true runs it, false skips it.
strictDepBuilds: true
allowBuilds:
  # Its postinstall only swaps esbuild's JS shim for the native binary. The JS API finds
  # the binary through esbuild's platform package without it, so tsup builds the engine.
  esbuild: false
  # Comes in through posthog-js. Its postinstall only prints a funding banner.
  core-js: false
