# cubic's review settings (https://docs.cubic.dev/configure/cubic-yaml), read from master only.
version: 1
reviews:
  ignore:
    files:
      # Card data, the promo catalog, the slug map and the lockfile: admin and the scripts
      # write them. Keep in step with the linguist-generated list in .gitattributes.
      - apps/web/public/data/allCards.json
      - apps/web/public/data/previewCards.json
      - apps/web/public/data/collection/*.json
      - scripts/data/promo-printings.json
      - middleware-data/card-slugs.json
      - pnpm-lock.yaml
